<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Životní cyklus rezervace</title><desc id="desc">Create vytvoří přímo CONFIRMED nebo PENDING_APPROVAL. Čekající žádost lze schválit, zamítnout nebo zrušit a při začátku vyprší. Potvrzenou lze před začátkem zrušit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#475569"/></marker></defs>
<rect width="1000" height="440" fill="#fff"/>
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
<path d="M180 190 L300 100"/><path d="M180 205 L300 300"/>
<path d="M420 265 V135"/><path d="M540 285 L750 205"/>
<path d="M540 305 L750 305"/><path d="M540 325 L750 405"/>
<path d="M540 100 L850 100 V170"/>
</g>
<g font-family="sans-serif" font-size="17" text-anchor="middle">
<rect x="30" y="170" width="150" height="55" rx="12" fill="#e2e8f0"/><text x="105" y="204">Create</text>
<rect x="300" y="70" width="240" height="65" rx="12" fill="#dcfce7"/><text x="420" y="108">CONFIRMED</text>
<rect x="300" y="265" width="240" height="65" rx="12" fill="#fef3c7"/><text x="420" y="303">PENDING_APPROVAL</text>
<rect x="750" y="170" width="210" height="65" rx="12" fill="#e2e8f0"/><text x="855" y="208">CANCELLED</text>
<rect x="750" y="270" width="210" height="65" rx="12" fill="#fee2e2"/><text x="855" y="308">REJECTED</text>
<rect x="750" y="370" width="210" height="65" rx="12" fill="#e2e8f0"/><text x="855" y="408">EXPIRED</text>
<g font-size="14" fill="#334155"><text x="210" y="112">bez schvalování</text><text x="210" y="285">se schvalováním</text>
<text x="490" y="200">správce schválí</text><text x="675" y="175">vlastník zruší</text>
<text x="650" y="289">správce / konkurent</text><text x="660" y="378">začátek rezervace</text>
<text x="700" y="82">vlastník zruší před začátkem</text></g>
</g></svg>
